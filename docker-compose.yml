version: '3.8'

services:
  mastra:
    build: .
    container_name: mastra-brain
    restart: unless-stopped
    ports:
      - "127.0.0.1:4111:4111"
    env_file:
      - .env
    environment:
      - PORT=4111
      - NODE_ENV=production
      - MASTRA_STUDIO_PATH=.mastra/output/playground
    volumes:
      - mastra_data:/opt/mastra/data
    networks:
      - mastra-net
    depends_on:
      - healthcheck
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4111/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Lightweight healthcheck to verify DB is ready before starting Mastra
  healthcheck:
    image: postgres:16-alpine
    container_name: mastra-db-check
    command: >
      sh -c "until pg_isready -h 127.0.0.1 -p 5432 -U mastra; do
        echo 'Waiting for PostgreSQL...';
        sleep 2;
      done;
      echo 'PostgreSQL is ready'"
    network_mode: host
    restart: "no"

volumes:
  mastra_data:

networks:
  mastra-net:
    name: mastra-net
    external: true
